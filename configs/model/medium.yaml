# Fontaine Medium — a free GPU (Kaggle T4 class) is the practical trainer.
# About 82M parameters at an 8k vocabulary. Dense: active parameters equal total.
# Provided to prove that the same codebase and config schema cover larger
# models without code changes. Not a reasonable CPU training target.
model:
  architecture: decoder_transformer
  vocab_size: auto
  hidden_size: 768
  num_layers: 12
  num_attention_heads: 12
  num_kv_heads: 4
  intermediate_size: 2048
  max_sequence_length: 1024
  rope_theta: 10000.0
  dropout: 0.0
  activation: swiglu
  normalization: rmsnorm
  norm_eps: 0.00001
  tie_word_embeddings: true
  attention_bias: false
  mlp_bias: false
