# Yami Small — everyday laptop CPU: 4-8 cores and 8-16 GB RAM.
# Dense decoder with the modern stack: GQA, SwiGLU, RMSNorm, RoPE, QK-norm.
# Serve with precision auto (int8 on CPU) to keep weights near 0.2 GB.
# Set vocab_size: auto to adopt a trained tokenizer; counts in the docs assume 32768.
model:
  architecture: decoder_transformer
  cpu_tier: "small — laptop CPU, 8-16 GB RAM"
  vocab_size: 32768
  hidden_size: 768
  num_layers: 12
  num_attention_heads: 12
  num_kv_heads: 4
  intermediate_size: 2560
  max_sequence_length: 4096
  rope_theta: 500000.0
  qk_norm: true
  dropout: 0.0
  activation: swiglu
  normalization: rmsnorm
  norm_eps: 0.00001
  tie_word_embeddings: true
  attention_bias: false
  mlp_bias: false
