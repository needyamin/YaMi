# Yami Base — desktop CPU: 8+ cores and 16-32 GB RAM.
# Adds sliding-window attention: three local layers (1024 tokens) per global
# layer, as in Gemma 3, so long prompts cost less compute per token.
# Training state is several GB before activations: enable gradient checkpointing.
# Set vocab_size: auto to adopt a trained tokenizer; counts in the docs assume 32768.
model:
  architecture: decoder_transformer
  cpu_tier: "base — 8+ core desktop CPU, 16-32 GB RAM"
  vocab_size: 32768
  hidden_size: 1024
  num_layers: 24
  num_attention_heads: 16
  num_kv_heads: 4
  intermediate_size: 3072
  max_sequence_length: 4096
  rope_theta: 500000.0
  qk_norm: true
  sliding_window: 1024
  global_attention_every: 4
  dropout: 0.0
  activation: swiglu
  normalization: rmsnorm
  norm_eps: 0.00001
  tie_word_embeddings: true
  attention_bias: false
  mlp_bias: false
