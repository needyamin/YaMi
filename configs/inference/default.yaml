# Inference / generation defaults (overridable per request via the API).
# Coding-oriented: low temperature, a tight nucleus, and a light repetition penalty.
# Chat stop sequences are added by /api/chat (the Alpaca turn markers), not here,
# so raw /api/generate is unchanged.
inference:
  temperature: 0.2
  top_k: 50
  top_p: 0.9
  repetition_penalty: 1.05
  max_new_tokens: 256
  stop_sequences: []
  seed: null
  model_name: "Yami v1.0"   # label in the chat model picker
  precision: auto           # auto | fp32 | bf16 | int8 (auto: int8 on CPU for 20M+ params)
  num_threads: 0            # CPU threads; 0 = PyTorch default (physical cores)
  server_host: 127.0.0.1
  server_port: 8321
  expert_budget_mb: 0       # 0 = every expert stays in RAM. A positive MiB cap streams routed experts from disk.
  expert_spill_dir: ""      # empty = a temporary directory for those expert files
  # Dense block streaming is configured on the serve CLI, not here: the loader
  # rejects unknown fields in this section. `fontaine serve --dense-budget-mb`
  # sets the resident RAM floor (default 12288 MiB = 12 GiB; 0 = keep all
  # block weights resident); blocks above the floor stream from disk.
  # dense_budget_mb / dense_spill_dir exist on InferenceConfig for that path.
