# Training on Kaggle notebooks (free GPU: T4 x2 / P100, 30 GPU-hours/week).
#
# Used by kaggle/train_fontaine_kaggle.ipynb — see docs/kaggle.md.
#
# device/precision "auto" resolves per hardware: bf16 on bf16-capable GPUs
# (A100), fp16 + GradScaler on T4/P100, fp32 on the free CPU tier.
#
# The notebook overrides batch size, sequence length, and gradient
# checkpointing from its preset table. This file is the shared GPU baseline.
# Training uses GPU 0 only. A T4 x2 accelerator does not start a second process.
#
# Presets that fit a 16 GB T4 (see the notebook): tiny, small, medium,
# coding_low, yami_nano, and yami_small with a small batch.
# Do not train yami_large, yami_base, or yami_super profiles above tiny here.
training:
  run_name: fontaine-kaggle
  experiments_dir: experiments
  device: auto
  max_steps: 20000
  batch_size: 64
  gradient_accumulation_steps: 1   # effective batch = 64 sequences
  learning_rate: 0.0003
  min_learning_rate_ratio: 0.1
  lr_scheduler: cosine
  warmup_steps: 200
  weight_decay: 0.1
  adam_beta1: 0.9
  adam_beta2: 0.95
  max_grad_norm: 1.0
  precision: auto
  gradient_checkpointing: false
  eval_interval: 500
  log_interval: 25
  checkpoint_interval: 2000
  keep_last_n_checkpoints: 2   # /kaggle/working persists max ~20 GB
  early_stopping_patience: 5   # stop after 5 evals with no val_loss drop; 0 disables
  seed: 42
  deterministic: false
