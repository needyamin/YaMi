      max_sequence_length: 8192
      rope_scaling_type: linear
      rope_scaling_factor: 2.0
      rope_original_context_length: 4096
      num_experts: 32
      num_experts_per_token: 4
      num_shared_experts: 1
      expert_capacity_factor: 1.25
      router:
        type: top_k
        load_balancing:
          enabled: true
