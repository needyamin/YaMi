<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>YaMi v1.0 — mascot preview</title>
<style>
  body { margin:0; padding:40px; background:#f6f7f9; color:#16181d;
         font:15px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  h1 { font-size:20px; margin:0 0 4px; }
  p.lead { color:#61656e; margin:0 0 32px; }
  .grid { display:flex; flex-wrap:wrap; gap:28px; align-items:flex-end; }
  .cell { text-align:center; }
  .cell span { display:block; margin-top:8px; font-size:12px; color:#61656e; }
  .onDark { background:#080b0d; padding:16px; border-radius:12px; }
  .lockup { display:flex; align-items:center; gap:10px; padding:12px 16px; border:1px solid #e3e6ea;
            border-radius:12px; background:#fff; }
  .lockup b { font-size:17px; font-weight:650; }
  .reply { display:flex; align-items:center; gap:8px; margin-top:14px; font-size:14px; color:#61656e; }
  .reply b { color:#16181d; font-weight:600; }
</style>
</head>
<body>
  <h1>YaMi v1.0 — pixel mascot</h1>
  <p class="lead">"Pip" — blue pixel helper. Shown at the sizes it actually appears.</p>

  <div class="grid">
    <div class="cell"><img src="yami-icon.svg" width="16"  height="16"  alt=""><span>16 px<br>favicon</span></div>
    <div class="cell"><img src="yami-icon.svg" width="32"  height="32"  alt=""><span>32 px</span></div>
    <div class="cell"><img src="yami-icon.svg" width="64"  height="64"  alt=""><span>64 px</span></div>
    <div class="cell"><img src="yami-icon.svg" width="128" height="128" alt=""><span>128 px</span></div>
  </div>

  <h1 style="margin-top:44px; font-size:16px">In context</h1>
  <div class="lockup">
    <img src="yami-icon.svg" width="30" height="30" alt="">
    <b>YaMi v1.0</b>
  </div>
  <div class="reply">
    <img src="yami-icon.svg" width="18" height="18" alt="">
    <b>YaMi v1.0</b>
  </div>
  <p class="lead" style="margin-top:28px">Palette matches the login page blue:
    <code>#1b4fbf</code> shadow · <code>#2f6feb</code> body · <code>#3d7bf0</code> mid · <code>#8fd0ff</code> highlight.</p>
</body>
</html>
